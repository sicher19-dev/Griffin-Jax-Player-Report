<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>No Brand Baseball Analytics | Player Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0D131C; --panel:#141C28; --panel-2:#1A2432; --raise:#202B3B;
  --ink:#D5DDE8; --ink-soft:#B3BFCE; --muted:#7F8DA1; --line:#243042; --grid:#1F2A3A;
  --head:#0A1019; --accent:#8FB6DA; --accent-strong:#B7D2EC;
  --gold:#C9AB52; --gold-soft:rgba(201,171,82,.10); --gold-line:rgba(201,171,82,.45);
  --flag:#D46A5E;
  --FF:#C8596B; --SI:#CF8C4E; --CH:#5BA66F; --SW:#BFA256; --CU:#4CA3B8; --SL:#8E7BC4; --FC:#A0735E; --FS:#5E97A3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{background:var(--head);color:var(--ink);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:18px 20px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--muted)}
.brand i{display:inline-block;width:22px;height:22px;border:2px solid var(--gold);border-radius:50%;position:relative}
.brand i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
.brand .int{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--ink-soft);background:var(--raise);padding:2px 8px;border-radius:3px}
.who{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px;margin:14px 0 16px}
.who h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,76px);line-height:.88;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.who h1 span{display:block;font-size:.42em;font-weight:600;color:var(--accent);letter-spacing:0;text-transform:none;margin-bottom:4px}
.facts{display:flex;gap:22px;flex-wrap:wrap;padding-bottom:6px}
.facts div{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.facts small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.switch{display:flex;gap:2px}
.switch button{background:none;border:0;padding:10px 16px 12px;font-family:var(--display);font-size:19px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0}
.switch button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:inset 0 2px 0 var(--gold)}
.switch button .soon{font-family:var(--body);font-size:11px;font-weight:500;margin-left:6px;opacity:.8}

main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}

/* game rail */
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.game{flex:0 0 auto;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;position:relative}
.game[aria-pressed=true]{border-color:var(--gold-line);background:var(--panel-2);box-shadow:inset 0 -3px 0 var(--gold)}
.game b{display:block;font-family:var(--display);font-size:22px;line-height:1.05}
.game .opp{font-weight:600}
.game .ln{font-size:12px;color:var(--muted)}
.game .cap{font-size:12px;margin-top:4px}
.game .park{position:absolute;top:8px;right:10px;font-size:11px;color:var(--flag);font-weight:600}


/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}

h2{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;margin:6px 0 4px;color:var(--ink)}
h3{font-family:var(--display);font-size:21px;font-weight:600;margin:0 0 6px;color:var(--accent-strong)}
.lede{color:var(--muted);max-width:72ch;margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:900px){.grid3,.grid2{grid-template-columns:1fr}}

/* notes */
.col h3{display:flex;align-items:center;gap:8px}
.col h3:before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent)}
.col.moved h3:before{background:var(--gold)}
.col.watch h3:before{background:transparent;border:2px solid var(--accent)}
.note{padding:10px 0;border-top:1px solid var(--line)}
.note b{display:block;font-weight:600;line-height:1.3;margin-bottom:2px}
.note p{margin:0;color:var(--ink-soft);font-size:14px}
.stamp{font-size:12px;color:var(--muted)}

/* movers */
.mover{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 90px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mover .nm{font-weight:600;line-height:1.25}
.mover .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mover .ag{font-size:12px;color:var(--muted);text-align:right}
.mover .ag b{display:block;font-family:var(--display);font-size:20px;color:var(--gold)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.caution{border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.caution b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.3px;color:var(--gold);margin-bottom:4px}
.caution p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.caution p+ul,.caution ul+p{margin-top:8px}
.roadlist{margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.roadlist b{display:inline;font-family:var(--body);font-size:13px;letter-spacing:0;color:var(--ink);margin:0}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px}
thead th{font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--line)}
tbody tr:hover td{background:var(--panel-2)}
td.grp{background:var(--raise)!important;font-family:var(--display);font-weight:600;font-size:16px;color:var(--accent-strong)}
.unit{color:var(--muted);font-size:12px}
.fixed{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold);color:var(--gold);cursor:help}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;color:#fff}
.pt{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pt:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.avgcol{background:var(--panel-2)}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.ctl select,.ctl input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ink);min-height:36px}
.ctl input{min-width:200px}
.ctl input[type=checkbox]{min-width:0;min-height:0;width:16px;height:16px;vertical-align:-3px;margin-right:6px;accent-color:var(--gold)}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;min-height:36px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel-2);color:var(--ink-soft);border:0;padding:6px 12px;cursor:pointer;min-height:34px}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}

/* small multiples */
.sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .t{font-weight:600;line-height:1.25;font-size:14px}
.card .u{font-size:12px;color:var(--muted)}
svg text{font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:4px 0 10px}
.legend .hol:before{background:transparent;border:2px solid var(--muted)}
.legend span.pt.hol{font-weight:500;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.pend{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;background:var(--panel)}
.pend h2{margin-bottom:8px}
.log li{margin:4px 0}
.log ul{margin:4px 0 0 0;padding-left:20px}
.log ul li{margin:2px 0;color:var(--ink-soft)}
@media (max-width:640px){
  .mover{grid-template-columns:1fr auto}
  .mover>div:nth-child(2){grid-column:1 / -1;order:3}
  .seqsvg{min-width:760px}
  main{padding:14px 12px 50px}
  .panel{padding:14px 12px}
}
footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.switch,.tabs,.ctl{display:none}.top{background:#fff;color:#000}}
</style>
</head>

<main id="app"></main>

    s.onerror=()=>{ if(src!==files[0]) done(); else document.getElementById('app').innerHTML='<div class="panel">No data file found for <b>'+slug+'</b>. Run tools/build_biomech.py.</div>'; };
    document.head.appendChild(s);
  });
})();

function boot(){
const D = window.NB_BIOMECH, N = window.NB_NOTES || null;
const S = D.sessions;                           // sorted by date
const M = D.metrics, MK = Object.fromEntries(M.map(m=>[m.key,m]));
const PT = {FF:'4-Seam',SI:'Sinker',CH:'Changeup',SW:'Sweeper',CU:'Curveball',SL:'Slider',FC:'Cutter',FS:'Splitter'};
const PORDER = ['FF','SI','CH','SW','CU','SL','FC','FS'];
const GROUPS = {release:'Release',sequence:'Sequence',arm:'Arm action',load:'Arm load (per pitch)',gametotal:'Arm load (game totals)',trunk:'Trunk',pelvis:'Pelvis and hips',legs:'Legs and feet',com:'Body drift'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const md = d => { const [y,m,dd]=d.split('-'); return (+m)+'/'+(+dd); };
const longDate = d => { const [y,m,dd]=d.split('-'); return MONTHS[+m-1]+' '+(+dd); };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc = p => `var(--${p})`;
const pitchesOf = s => PORDER.filter(p=>s.pitches[p]);
const allPitches = PORDER.filter(p=>S.some(s=>s.pitches[p]));

/* home park = the venue with the most captured games; others get flagged */
const venueCount = {}; S.forEach(s=>{ if(s.venue) venueCount[s.venue]=(venueCount[s.venue]||0)+1; });
const homePark = Object.entries(venueCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
const pen = s => s.kind==='bullpen';
const G = S.filter(s=>!pen(s));
const away = s => !pen(s) && s.venue && s.venue!==homePark;
const rng = s => s.range ? `${longDate(s.range[0])}–${longDate(s.range[1])}` : longDate(s.date);
const nameOf = s => pen(s) ? `Bullpen block, ${rng(s)}` : `${longDate(s.date)} ${s.home===false?'at':'vs'} ${s.opp||''}`;
const shortOf = s => pen(s) ? 'Pen' : md(s.date);

function dec(unit, v){
  if (v==null || isNaN(v)) return '–';
  const a=Math.abs(v);
  let d = {'°/s':0,'°/s²':0,'N':0,'×BW':2,'ratio':2}[unit];
  if (d===undefined) d = (unit==='ms' && Number.isInteger(v)) ? 0 : 1;
  if (unit==='N·m' && a>=1000) d=0;
  if (unit==='N' || unit==='°/s' || unit==='°/s²' || a>=1000) return Math.round(v).toLocaleString('en-US');
  return v.toFixed(d);
}
const withUnit = (txt,unit) => (unit==='°'||unit==='%') ? txt+unit : txt+' '+unit;
const fmt = (k,v) => (MK[k]?.group==='gametotal' && v!=null) ? Math.round(v).toLocaleString('en-US') : dec(MK[k]?.unit, v);
const val = (s,k,p) => p ? s.pitches[p]?.v?.[k] : s.all?.[k];
const fixedCell = (s,k,p) => (s.flags||[]).find(f=>(f.type==='fix'||f.type==='text') && f.key===k && f.pitch===p);

/* ---------- state ---------- */
const A = window.NB_ANALYTICS || null, RV = window.NB_REVIEWS || {};
const AS = A ? A.starts : [];
const st = { report:'bio', tab:'summary', focus: S[S.length-1].date, dataMode:'game', dataGroup:'all', q:'', linkM:'arm_slot', linkT:'ivb',
  aTab:'season', aFocus: AS.length ? AS[AS.length-1].date : null, aOpeners:false, aPitch:'all', aMetric:'whiffPct' };

/* ---------- header ---------- */
const P = D.player;
document.getElementById('pname').insertAdjacentText('beforeend', P.name);
document.getElementById('pteam').textContent = `${P.throws}HP  |  ${P.team}`;
const totalCap = S.reduce((a,s)=>a+s.captured,0);
const factsBio = `<div>${G.length}<small>mocap games</small></div>${S.some(pen)?`<div>+${S.filter(pen).length}<small>bullpen block</small></div>`:''}<div>${totalCap}<small>pitches captured</small></div><div>${md(S[0].date)}–${md(S[S.length-1].date)}<small>${P.season} window</small></div>`;
const factsAna = A ? (()=>{ const ss=A.starts.filter(x=>x.role==='starter'); return `<div>${ss.length}<small>starts</small></div><div>${A.season.all.n.toLocaleString('en-US')}<small>pitches as a starter</small></div><div>${md(ss[0].date)}–${md(ss[ss.length-1].date)}<small>${P.season} window</small></div>`; })() : factsBio;
document.getElementById('foot').textContent = `No Brand Baseball Analytics  |  built ${D.built}  |  internal use only`;
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{st.report=b.dataset.report;render();});

const TABS = [['summary','Summary'],['sequence','Sequence'],['pitches','Pitch types'],['shape','Body & ball'],['load','Arm load'],['body','Body'],['data','All data'],['log','Data log']];

/* ---------- helpers: stats ---------- */
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
function baselineFor(focus){
  // compare the focus game to the other games in the same park; fall back to all other games
  const f = S.find(s=>s.date===focus);
  let base = pen(f) ? G.filter(s=>s.venue===homePark) : G.filter(s=>s.date!==focus && s.venue===f.venue);
  const samePark = base.length>0;
  if (!samePark) base = G.filter(s=>s.date!==focus);
  return {f, base, samePark};
}
// how far a capture sits outside the home-park range, metric by metric. A one-off
// park with a long list here is a different camera install, not a different delivery.
function offPark(date){
  const f=S.find(s=>s.date===date), home=G.filter(s=>s.venue===homePark && s.date!==date);
  if (!f || home.length<2) return null;
  let out=0, n=0;
  M.forEach(m=>{
    if (m.group==='gametotal') return;
    const v=f.all[m.key], xs=home.map(s=>s.all[m.key]).filter(q=>q!=null);
    if (v==null || !xs.length) return;
    n++; if (v<Math.min(...xs) || v>Math.max(...xs)) out++;
  });
  return n ? {out, n} : null;
}
function movers(focus){
  const {f, base} = baselineFor(focus);
  if (!base.length) return [];
  const out=[];
  M.forEach(m=>{
    if (m.group==='gametotal' || m.unit==='ratio' || m.unit==='×BW') return;
    const fv=f.all[m.key]; if (fv==null) return;
    const bv=mean(base.map(s=>s.all[m.key]).filter(v=>v!=null));
    // noise scale: pitch-to-pitch spread inside the baseline games
    const spreads = base.map(s=>{ const xs=pitchesOf(s).map(p=>s.pitches[p].v[m.key]).filter(v=>v!=null); return xs.length>1? Math.max(...xs)-Math.min(...xs):0; });
    const between = base.length>1 ? Math.max(...base.map(s=>s.all[m.key]))-Math.min(...base.map(s=>s.all[m.key])) : 0;
    const noise = Math.max(mean(spreads)/2, between, 0.5, Math.abs(bv)*0.01);
    const diff=fv-bv, z=diff/noise;
    // agreement: how many pitch types moved the same way vs their own baseline
    let agree=0, n=0;
    pitchesOf(f).forEach(p=>{
      const b=base.map(s=>s.pitches[p]?.v[m.key]).filter(v=>v!=null); const x=f.pitches[p].v[m.key];
      if (!b.length || x==null) return; n++;
      if (Math.sign(x-mean(b))===Math.sign(diff) && Math.abs(x-mean(b))>0) agree++;
    });
    if (Math.abs(z)>=1.5 && n>=3 && agree>=n-1) out.push({m,fv,bv,diff,z,agree,n});
  });
  return out.sort((a,b)=>Math.abs(b.z)-Math.abs(a.z));
}
function repeats(){
  // pitch-type differences that point the same way in every game
  const out=[]; if (G.length<2) return out;
  M.forEach(m=>{
    if (m.group==='gametotal' || m.unit==='ratio' || m.unit==='×BW' || m.unit==='vel') return;
    allPitches.forEach(p=>{
      const ds=[], sp=[];
      for (const s of G){
        const x=s.pitches[p]?.v[m.key]; if (x==null) return;
        const others=pitchesOf(s).filter(q=>q!==p).map(q=>s.pitches[q].v[m.key]).filter(v=>v!=null);
        if (others.length<2) return;
        ds.push(x-mean(others)); sp.push(Math.max(...others)-Math.min(...others));
      }
      if (ds.length!==G.length) return;
      const sg=Math.sign(ds[0]); if (!ds.every(d=>Math.sign(d)===sg && d!==0)) return;
      const minAbs=Math.min(...ds.map(Math.abs)); const noise=Math.max(mean(sp)/2,0.3);
      if (minAbs/noise>=1.2) out.push({m,p,ds,score:minAbs/noise});
    });
  });
  return out.sort((a,b)=>b.score-a.score);
}

/* ---------- svg helpers ---------- */
function scale(d0,d1,r0,r1){ const k=(r1-r0)/((d1-d0)||1); return v=>r0+(v-d0)*k; }
function nice(lo,hi){ if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*0.12; return [lo-pad,hi+pad]; }

/* dot strip: one column per game, one dot per pitch type, bar = game average */
function gameStrip(k, opts={}){
  const W=opts.w||300, H=opts.h||120, L=38, R=8, T=10, B=24;
  const vals=[]; S.forEach(s=>{ pitchesOf(s).forEach(p=>{const v=s.pitches[p].v[k]; if(v!=null) vals.push(v);}); });
  if (!vals.length) return '';
  const [lo,hi]=nice(Math.min(...vals),Math.max(...vals));
  const y=scale(lo,hi,H-B,T), step=(W-L-R)/S.length;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(MK[k].label)} by game">`;
  [lo+(hi-lo)*0.1, (lo+hi)/2, hi-(hi-lo)*0.1].forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-4}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${dec(MK[k].unit,t)}</text>`; });
  S.forEach((s,i)=>{
    const cx=L+step*(i+.5), foc=s.date===st.focus;
    if (foc) g+=`<rect x="${cx-step/2+2}" y="${T-6}" width="${step-4}" height="${H-B-T+10}" fill="var(--gold-soft)" rx="4"/>`;
    const a=s.all[k]; if(a!=null) g+=`<line x1="${cx-step*.32}" x2="${cx+step*.32}" y1="${y(a)}" y2="${y(a)}" stroke="var(--ink)" stroke-width="2.5"/>`;
    pitchesOf(s).forEach((p,j,arr)=>{ const v=s.pitches[p].v[k]; if(v==null) return;
      const x=cx+(j-(arr.length-1)/2)*Math.min(7,step/7);
      g+= pen(s) ? `<rect x="${x-3.4}" y="${y(v)-3.4}" width="6.8" height="6.8" fill="none" stroke="${pc(p)}" stroke-width="1.8"><title>Bullpen ${PT[p]}: ${fmt(k,v)}</title></rect>`
        : away(s) ? `<circle cx="${x}" cy="${y(v)}" r="3.6" fill="var(--panel)" stroke="${pc(p)}" stroke-width="1.8"><title>${md(s.date)} ${PT[p]}: ${fmt(k,v)}</title></circle>`
                  : `<circle cx="${x}" cy="${y(v)}" r="3.8" fill="${pc(p)}"><title>${md(s.date)} ${PT[p]}: ${fmt(k,v)}</title></circle>`;
    });
    g+=`<text x="${cx}" y="${H-7}" font-size="11" text-anchor="middle" fill="${foc?'var(--gold)':'var(--muted)'}" font-weight="${foc?600:400}">${shortOf(s)}</text>`;
  });
  return g+'</svg>';
}
function legend(extra=true){
  return `<div class="legend">${allPitches.map(p=>`<span class="pt" style="--c:${pc(p)}">${p} ${PT[p]}</span>`).join('')}
  <span><svg width="22" height="8"><line x1="1" x2="21" y1="4" y2="4" stroke="var(--ink)" stroke-width="2.5"/></svg> game average</span>
  ${extra && S.some(away)?`<span class="pt hol" style="--c:transparent">open dot = not ${esc(homePark||'home park')}</span>`:''}
  ${extra && S.some(pen)?`<span style="color:var(--muted)"><svg width="10" height="10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="var(--muted)" stroke-width="1.6"/></svg> open square = bullpen block</span>`:''}</div>`;
}

/* ---------- views ---------- */
function vRail(){
  return `<div class="rail" role="group" aria-label="Focus game">${S.map(s=>{
    const l=s.line;
    if (pen(s)) return `<button class="game" data-g="${s.date}" aria-pressed="${st.focus===s.date}">
      <span class="park" style="color:var(--accent)">not a game</span>
      <b>Bullpen</b><span class="opp">${md(s.range[0])}–${md(s.range[1])}</span>
      <div class="ln">all pen work, one sheet</div>
      <div class="cap">${s.captured} pitches captured</div></button>`;
    return `<button class="game" data-g="${s.date}" aria-pressed="${st.focus===s.date}">
      ${away(s)?`<span class="park">other park</span>`:''}
      <b>${longDate(s.date)}</b><span class="opp">${s.home===false?'at ':'vs '}${esc(s.oppAbbr||'?')}</span>
      <div class="ln">${l?`${l.ip} IP, ${l.h} H, ${l.er} ER, ${l.bb} BB, ${l.k} K`:'line not matched'}</div>
      <div class="cap">${s.captured}${l?` of ${l.pc}`:''} pitches captured</div></button>`;}).join('')}</div>`;
}
function vTabs(){ return `<div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}</button>`).join('')}</div>`; }

function vSummary(){
  const f=S.find(s=>s.date===st.focus); const {base,samePark}=baselineFor(st.focus);
  const mv=movers(st.focus).slice(0,8);
  const op = (!pen(f) && !samePark) ? offPark(st.focus) : null;
  const caution = op ? `<div class="caution"><b>Only capture at ${esc(f.venue||'this park')}</b>
    <p>There is no second game here to compare against, so the list below is measured against his games at ${esc(homePark)} — a different camera install. ${op.out} of ${op.n} metrics on this sheet sit outside his ${esc(homePark)} range, which is the size of gap a setup change produces on its own. Read these as differences between capture settings until a second ${esc(f.venue||'')} game lands. The ball data on the Analytics side is not affected.</p></div>` : '';
  const notes = N ? `<div class="panel"><div class="grid3">
    ${[['steady','Holding steady',N.steady],['moved','What moved',N.moved],['watch','What we are watching',N.watching]].map(([c,h,arr])=>`
    <div class="col ${c}"><h3>${h}</h3>${arr.map(n=>`<div class="note"><b>${esc(n.h)}</b><p>${esc(n.p)}</p></div>`).join('')}</div>`).join('')}
    </div><p class="stamp">Notes written through ${longDate(N.through)}${S[S.length-1].date>N.through?` — games after this date are in the charts but not in these notes yet`:''}.</p></div>` : '';
  const heads=['mprv','mtrv','meev','mhv','fc_pel_t','sep_fc','sh_rot_mer','arm_slot','stride','varus'];
  return `<h2>${esc(nameOf(f))}</h2>
  <p class="lede">${pen(f)?`How his bullpen work (${rng(f)}) differs from his ${base.length} games at ${esc(homePark)}. Bullpen capture runs on a different setup, so read these as differences between settings, not changes over time.`:`What changed in this game compared with his other ${base.length} ${base.length===1?'game':'games'}${away(f)?'':` at ${esc(homePark)}`}.`} A metric only shows up here if the game average moved well past his normal pitch-to-pitch spread <i>and</i> nearly every pitch type moved the same way.</p>
  ${caution}
  <div class="panel">
    <h3>${pen(f)?'Biggest differences from his games':'Biggest movers this game'}</h3>
    ${mv.length? mv.map(o=>`<div class="mover"><div class="nm">${esc(o.m.label)}<small>${withUnit(fmt(o.m.key,o.fv),o.m.unit)} ${pen(f)?'in the pen':'this game'}, ${withUnit(fmt(o.m.key,o.bv),o.m.unit)} ${pen(f)?'in games':'before'}</small></div>
      <div>${moverBar(o)}</div><div class="ag"><b>${o.diff>0?'+':''}${fmt(o.m.key,o.diff)}</b>${o.agree} of ${o.n} pitch types</div></div>`).join('')
      : `<div class="empty">Nothing moved past his normal spread. ${base.length<2?'More games at this park will sharpen this.':''}</div>`}
  </div>
  ${notes}
  <h3>Headline numbers by game</h3>${legend()}
  <div class="sm">${heads.filter(k=>MK[k]).map(k=>`<div class="card"><div class="t">${esc(MK[k].label)}</div><div class="u">${MK[k].unit}</div>${gameStrip(k)}</div>`).join('')}</div>`;
}
function moverBar(o){
  const W=220,H=26, lo=Math.min(o.fv,o.bv), hi=Math.max(o.fv,o.bv), pad=(hi-lo)*0.6||1;
  const x=scale(lo-pad,hi+pad,6,W-6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true"><line x1="6" x2="${W-6}" y1="13" y2="13" stroke="var(--grid)" stroke-width="2"/>
  <line x1="${x(o.bv)}" x2="${x(o.fv)}" y1="13" y2="13" stroke="var(--gold)" stroke-width="4" opacity=".8"/>
  <circle cx="${x(o.bv)}" cy="13" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><circle cx="${x(o.fv)}" cy="13" r="6" fill="var(--ink)"/></svg>`;
}

function vSequence(){
  const segs = S.map(s=>{ const q=s.summary; if(!q || q.hand==null) return null;
    const tSh=-q.shoulder_to_br, tEl=tSh-q.elbow_to_shoulder, tTr=tEl-q.trunk_to_elbow, tPe=tTr-q.pelvis_to_trunk, tFc=tPe-q.fc_to_pelvis, tHa=tSh+q.shoulder_to_hand;
    return {s, pts:[['Pelvis',tPe,q.pelvis],['Trunk',tTr,q.trunk],['Elbow',tEl,q.elbow],['Shoulder',tSh,q.shoulder],['Hand',tHa,q.hand]], tFc};
  }).filter(Boolean);
  const W=1000, rowH=78, T=40, H=T+rowH*segs.length+20, L=110, R=30;
  const minT=Math.min(-150,...segs.map(x=>x.tFc))-5;
  const x=scale(minT,15,L,W-R);
  const col={Pelvis:'#3E5775',Trunk:'#56789E',Elbow:'#7A9FC6',Shoulder:'#A9C6E3',Hand:'var(--gold)'};
  let g=`<svg class="seqsvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kinematic sequence timing by game">`;
  for(let t=-140;t<=10;t+=20){ g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T-12}" y2="${H-14}" stroke="${t===0?'var(--gold)':'var(--grid)'}" stroke-width="${t===0?2:1}"/><text x="${x(t)}" y="${T-18}" font-size="12" text-anchor="middle" fill="var(--muted)">${t===0?'release':t+' ms'}</text>`; }
  segs.forEach((o,i)=>{
    const cy=T+rowH*i+rowH/2, foc=o.s.date===st.focus;
    if (foc) g+=`<rect x="0" y="${cy-rowH/2+4}" width="${W}" height="${rowH-8}" fill="var(--gold-soft)" rx="6"/>`;
    g+=`<text x="8" y="${cy-4}" font-size="16" font-weight="600" fill="var(--ink)">${pen(o.s)?'Bullpen':md(o.s.date)+' '+esc(o.s.oppAbbr||'')}</text><text x="8" y="${cy+14}" font-size="12" fill="var(--muted)">${Math.round(-o.tFc)} ms FS to release${away(o.s)?' *':''}</text>`;
    g+=`<line x1="${x(o.tFc)}" x2="${x(o.pts[4][1])}" y1="${cy}" y2="${cy}" stroke="var(--line)" stroke-width="3"/>`;
    g+=`<g><rect x="${x(o.tFc)-2}" y="${cy-14}" width="4" height="28" fill="var(--ink)"/><text x="${x(o.tFc)}" y="${cy+30}" font-size="11" text-anchor="middle" fill="var(--ink)">foot strike</text></g>`;
    o.pts.forEach(([nm,t,v],j)=>{
      const r=4+Math.sqrt(v)/9;
      g+=`<circle cx="${x(t)}" cy="${cy}" r="${r}" fill="${col[nm]}" stroke="var(--panel)" stroke-width="1.5"><title>${nm} peak ${Math.round(v).toLocaleString()}°/s at ${t} ms</title></circle>`;
      const anc = nm==='Shoulder'?'end':nm==='Hand'?'start':'middle', dx = nm==='Shoulder'?-3:nm==='Hand'?3:0;
      g+=`<text x="${x(t)+dx}" y="${cy-r-5}" font-size="11" text-anchor="${anc}" fill="var(--ink)" font-weight="600">${Math.round(v).toLocaleString()}</text>`;
      g+=`<text x="${x(t)+dx}" y="${cy+r+13}" font-size="10" text-anchor="${anc}" fill="var(--muted)">${nm}</text>`;
    });
  });
  g+='</svg>';
  const f=S.find(s=>s.date===st.focus);

  const keys=['mprv','fc_pel_t','mtrv','tr_acc','pel_elb_t','tr_elb_t','meev','meev_br_t','msrv','msrv_br_t','mhv','mhv_br_t'];
  return `<h2>Sequence</h2><p class="lede">Peak rotational speed of each segment and when it peaks, measured back from ball release. Circle size follows speed. Numbers are game averages across every captured pitch.</p>
  <div class="panel"><div class="tw">${g}</div>${S.some(away)?`<div class="stamp">* captured at a different park — compare with care</div>`:''}</div>
  <div class="panel"><h3>${esc(nameOf(f))}, by pitch type</h3><div class="tw">${pitchTable(f, keys)}</div></div>
  <h3>By game</h3>${legend()}<div class="sm">${['mprv','mtrv','meev','msrv','mhv','fc_pel_t','tr_elb_t','tr_acc'].map(k=>`<div class="card"><div class="t">${esc(MK[k].label)}</div><div class="u">${MK[k].unit}</div>${gameStrip(k)}</div>`).join('')}</div>`;
}

function pitchTable(s, keys, group=false){
  const ps=pitchesOf(s);
  let h=`<table><thead><tr><th>Metric</th>${ps.map(p=>`<th><span class="pt" style="--c:${pc(p)}">${p}</span><br><span class="unit">${s.pitches[p].n} pitches</span></th>`).join('')}<th class="avgcol">Game</th><th>Unit</th></tr></thead><tbody>`;
  let lastG=null;
  keys.forEach(k=>{ const m=MK[k]; if(!m) return;
    if (group && m.group!==lastG){ lastG=m.group; h+=`<tr><td class="grp" colspan="${ps.length+3}">${GROUPS[m.group]||m.group}</td></tr>`; }
    h+=`<tr><td>${esc(m.label)}</td>${ps.map(p=>{ const fx=fixedCell(s,k,p); const v=s.pitches[p].v[k];

  });

}

/* ---------- Body & ball: mocap next to what the ball did ---------- */
const BALL = window.NB_ANALYTICS ? Object.fromEntries(window.NB_ANALYTICS.starts.map(x=>[x.date,x])) : {};
const paired = () => G.filter(s=>BALL[s.date]);        // games with both a capture and a ball file
const ballOf = (s,p) => (BALL[s.date]||{}).pitches?.[p];

/* body metric -> ball metric pairs worth looking at */
const LINKS = [
  {m:'arm_slot',  t:'arm',  ml:'Arm slot',            tl:'Arm angle (ball)',      d:1, note:'Two independent reads of the same thing.'},
  {m:'rel_height',t:'relZ', ml:'Release height',      tl:'Release height (ball)', d:1, note:'Capture is in inches, ball file in feet.'},
  {m:'rel_side',  t:'relX', ml:'Release side',        tl:'Release side (ball)',   d:1, note:'Signs are opposite: the capture counts out from the middle, the ball file counts toward first base.'},
  {m:'rel_ext',   t:'ext',  ml:'Extension',           tl:'Extension (ball)',      d:1, note:'These two do not line up — see the note below.'},
  {m:'mhv',       t:'velo', ml:'Peak hand speed',     tl:'Velocity',              d:0},
  {m:'msrv',      t:'velo', ml:'Peak shoulder speed', tl:'Velocity',              d:0},
  {m:'sh_rot_mer',t:'velo', ml:'Layback',             tl:'Velocity',              d:1},
  {m:'arm_slot',  t:'ivb',  ml:'Arm slot',            tl:'Up-and-down movement',  d:1},
  {m:'hz_max',    t:'hb',   ml:'Scap load',           tl:'Side-to-side movement', d:1},
  {m:'pro_br',    t:'hb',   ml:'Forearm pronation at release', tl:'Side-to-side movement', d:1},
];
function pearson(x,y){
  const n=x.length; if(n<3) return null;
  const mx=x.reduce((a,b)=>a+b,0)/n, my=y.reduce((a,b)=>a+b,0)/n;
  const sx=Math.sqrt(x.reduce((a,v)=>a+(v-mx)**2,0)), sy=Math.sqrt(y.reduce((a,v)=>a+(v-my)**2,0));
  if(!sx||!sy) return null;
  return x.reduce((a,v,i)=>a+(v-mx)*(y[i]-my),0)/(sx*sy);
}
/* mini scatter: one dot per game for a single pitch type */
function miniScatter(pts, col, focusIdx){
  const W=150,H=104,L=6,R=6,T=8,B=8;
  if(pts.length<2) return '';
  const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]);
  const [x0,x1]=nice(Math.min(...xs),Math.max(...xs)), [y0,y1]=nice(Math.min(...ys),Math.max(...ys));
  const X=scale(x0,x1,L,W-R), Y=scale(y0,y1,H-B,T);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
  g+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--panel-2)" rx="4"/>`;
  pts.forEach((q,i)=>{ const f=i===focusIdx;
    g+=`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="${f?5:3.4}" fill="${f?'none':col}" stroke="${f?'var(--gold)':'none'}" stroke-width="${f?2.4:0}" opacity="${f?1:.8}"><title>${esc(q[2])}</title></circle>`; });
  return g+'</svg>';
}
function vShape(){
  const P7=paired(), f=S.find(s=>s.date===st.focus);
  if(!P7.length) return `<h2>Body &amp; ball</h2><div class="empty">The analytics file isn't loaded, so there is nothing to pair the capture against.</div>`;
  const fb=BALL[f.date];
  const idx=P7.findIndex(s=>s.date===f.date);
  const link=LINKS.find(l=>l.m===st.linkM&&l.t===st.linkT)||LINKS[7];
  const ps=pitchesOf(f).filter(p=>ballOf(f,p));

  /* focused game: body columns then ball columns */
  const side = fb ? `<div class="tw"><table><thead>
    <tr><th></th><th colspan="6" style="text-align:center;color:var(--accent-strong);border-bottom:1px solid var(--line)">What the body did</th><th colspan="5" style="text-align:center;color:var(--gold);border-bottom:1px solid var(--line)">What the ball did</th></tr>
    <tr><th>Pitch</th><th>Arm slot</th><th>Release<br>height</th><th>Release<br>side</th><th>Layback</th><th>Scap<br>load</th><th>Pronation<br>at release</th>
    <th>#</th><th>mph</th><th>Up-down<br><span class="unit">in</span></th><th>Side<br><span class="unit">in</span></th><th>Spin<br><span class="unit">rpm</span></th></tr></thead><tbody>${
    ps.map(p=>{ const m=f.pitches[p].v, t=ballOf(f,p);
      return `<tr><td><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></td>
        <td>${fmt('arm_slot',m.arm_slot)}°</td><td>${fmt('rel_height',m.rel_height)}</td><td>${fmt('rel_side',m.rel_side)}</td>
        <td>${fmt('sh_rot_mer',m.sh_rot_mer)}°</td><td>${fmt('hz_max',m.hz_max)}°</td><td>${fmt('pro_br',m.pro_br)}°</td>
        <td class="avgcol">${t.n}</td><td class="avgcol">${t.velo==null?'–':t.velo.toFixed(1)}</td><td class="avgcol">${t.ivb==null?'–':t.ivb.toFixed(1)}</td>
        <td class="avgcol">${t.hb==null?'–':t.hb.toFixed(1)}</td><td class="avgcol">${t.spin==null?'–':Math.round(t.spin)}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p class="stamp">Capture numbers are in the capture system's own frame (inches, its own zero). Ball numbers come from the game feed. Side-to-side: negative runs to his arm side.</p>` : '';

  /* agreement between the two systems, pooled across every captured pitch */
  const agree = ['arm_slot','rel_height','rel_side','rel_ext'].map(k=>{
    const L=LINKS.find(l=>l.m===k);
    const xs=[],ys=[],lab=[];
    P7.forEach(s=>pitchesOf(s).forEach(p=>{ const t=ballOf(s,p); if(!t||s.pitches[p].v[k]==null||t[L.t]==null) return;
      xs.push(s.pitches[p].v[k]); ys.push(t[L.t]); lab.push(`${md(s.date)} ${PT[p]}`); }));
    const r=pearson(xs,ys), strong=r!=null&&Math.abs(r)>=0.7;
    const W=190,H=150,L2=8,R2=8,T2=10,B2=10;
    const [x0,x1]=nice(Math.min(...xs),Math.max(...xs)), [y0,y1]=nice(Math.min(...ys),Math.max(...ys));
    const X=scale(x0,x1,L2,W-R2), Y=scale(y0,y1,H-B2,T2);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true"><rect width="${W}" height="${H}" fill="var(--panel-2)" rx="4"/>`;
    xs.forEach((v,i)=>{ g+=`<circle cx="${X(v).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3" fill="var(--accent)" opacity=".75"><title>${esc(lab[i])}</title></circle>`; });
    g+='</svg>';
    return `<div class="card"><div class="t">${L.ml} <span class="unit">vs</span> ${L.tl}</div>
      <div class="u" style="color:${strong?'var(--CH)':'var(--flag)'}">${r==null?'–':(strong?'they agree':'they do not line up')} · r ${r==null?'–':r.toFixed(2)} · ${xs.length} pitch-games</div>
      ${g}<p class="stamp" style="margin:6px 0 0">${esc(L.note||'')}</p></div>`;
  }).join('');

  /* body -> ball, one mini scatter per pitch type */
  const cells = PORDER.filter(p=>P7.every(s=>s.pitches[p]&&ballOf(s,p))).map(p=>{
    const pts=P7.map(s=>{ const m=s.pitches[p].v[link.m], t=ballOf(s,p)[link.t];
      return (m==null||t==null)?null:[m,t,`${md(s.date)} — ${link.ml} ${(+m).toFixed(link.d)}, ${link.tl} ${(+t).toFixed(link.d)}`]; }).filter(Boolean);
    const r=pearson(pts.map(q=>q[0]),pts.map(q=>q[1]));
    const ns=P7.map(s=>s.pitches[p].n), nlo=Math.min(...ns), nhi=Math.max(...ns);
    const thin=nlo<8;
    const tag = r==null?'–':Math.abs(r)>=0.7?'moves together':Math.abs(r)>=0.4?'leans that way':'no link';
    return `<div class="card"><div class="t"><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></div>
      <div class="u">${tag}${r==null?'':` · r ${r.toFixed(2)}`} · ${pts.length} games · ${nlo===nhi?nlo:nlo+'–'+nhi} per game${thin?' <span style="color:var(--flag)">thin</span>':''}</div>
      ${miniScatter(pts,pc(p),P7.findIndex(s=>s.date===st.focus))}</div>`;
  }).join('');

  return `<h2>Body &amp; ball</h2>
  <p class="lede">The capture and the game feed, side by side for the ${P7.length} games that have both. Everything here is a game average per pitch type, so it answers "what did his body do when the ball moved this way," not what any single pitch did.</p>
  <div class="panel"><h3>${esc(nameOf(f))}</h3>${side}</div>
  <div class="panel"><h3>Do the two systems agree?</h3>
    <p class="stamp" style="margin-top:0">Every captured pitch type from every captured game, one dot each. If the two systems are measuring the same thing, the dots line up.</p>
    <div class="sm" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${agree}</div>
    <p class="stamp">Release height, release side and arm slot line up, which is the check that matters: the capture and the ball file are describing the same delivery. Extension does not, so treat the capture's extension as its own measurement and use the ball file's number when you want the one hitters feel.</p></div>
  <div class="panel"><h3>What moves with what</h3>
    <div class="ctl"><select id="linkSel" aria-label="Pair">${LINKS.map((l,i)=>`<option value="${i}"${l===link?' selected':''}>${esc(l.ml)} → ${esc(l.tl)}</option>`).join('')}</select></div>
    <p class="stamp" style="margin-top:0">One dot per game: the body number across, the ball number up. Gold ring is ${esc(nameOf(f))}.</p>
    <div class="sm" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${cells}</div>
    <p class="stamp"><b>Read these as leads, not findings.</b> Seven games is a small sample, and a game average hides the pitch-to-pitch spread underneath it. A strong line here is a reason to look at the next capture, not a conclusion. Pitches marked <span style="color:var(--flag)">thin</span> had fewer than 8 thrown in at least one game, so those game averages move around on their own.</p></div>`;
}

      ${fl.filter(x=>x.type==='bullpen').map(x=>`<li><b>Bullpen block:</b> ${esc(x.why)}</li>`).join('')}
      ${fl.filter(x=>x.type==='resent').map(x=>`<li><b>Re-sent sheet:</b> ${esc(x.file)} replaces the earlier copy in ${esc(x.prev)} (dated ${md(x.prevSheetDate)} there). ${x.changed.length?`${x.changed.length} values changed: `+x.changed.map(c=>`${c.pitch} ${esc(MK[c.key]?.label||c.key)} ${c.was} → ${c.now}`).join('; ')+'.':'No values changed.'}</li>`).join('')}
      ${fl.filter(x=>x.type==='date').map(x=>`<li><b>Date:</b> sheet says ${md(x.sheet)}, but the pitch mix only matches his ${md(x.actual)} start (${esc(x.why)}). Filed under ${md(x.actual)}.</li>`).join('')}
      ${(()=>{ const fx=fl.filter(x=>x.type==='fix'), seen=new Set(), out=[];
        fx.forEach(x=>{ if(seen.has(x.why)) return; seen.add(x.why);
          const grp=fx.filter(y=>y.why===x.why);
          if(grp.length===1) out.push(`<li><b>Corrected</b> ${lab(x)}: ${x.raw} → ${x.fixed==null?'left blank':x.fixed}. ${esc(x.why)}</li>`);
          else out.push(`<li><b>Corrected ${grp.length} values</b> — ${esc(x.why)}<ul>${grp.map(y=>`<li>${lab(y)}: ${y.raw} → ${y.fixed==null?'left blank':y.fixed}</li>`).join('')}</ul></li>`);
        }); return out.join(''); })()}
      ${fl.filter(x=>x.type==='text').map(x=>`<li><b>Text in a number cell</b> ${lab(x)}: "${esc(x.raw)}" → ${x.fixed??'blank'}. ${esc(x.why)}</li>`).join('')}
      ${(()=>{ const dp=fl.filter(x=>x.type==='dup');
        const done=dp.filter(x=>fl.some(y=>y.type==='fix'&&y.key===x.key&&y.pitch===x.pitch));
        const open_=dp.filter(x=>!done.includes(x));
        let out='';
        if(done.length>2) out+=`<li><b>Repeated rows disagree</b> on ${done.length} values (${[...new Set(done.map(x=>MK[x.key]?.label||x.key))].map(esc).join('; ')}). All resolved by the corrections above.</li>`;
        else out+=done.map(x=>`<li><b>Repeated row disagrees</b> ${lab(x)}: ${x.primary} vs ${x.repeat} (rows ${x.rows.join(' and ')}). Resolved by the correction above.</li>`).join('');
        out+=open_.map(x=>`<li><b>Repeated row disagrees</b> ${lab(x)}: ${x.primary} vs ${x.repeat} (rows ${x.rows.join(' and ')}). Using ${x.primary}.</li>`).join('');
        return out; })()}
      ${fl.filter(x=>x.type==='total').map(x=>{ const base=x.key.replace('gt_',''); const res=fl.some(y=>y.type==='fix'&&y.pitch===x.pitch&&y.key===base); return `<li><b>Game total off</b> ${lab(x)}: sheet ${x.sheet}, per-pitch × count = ${x.computed}. ${res?'The sheet total was right; resolved by the per-pitch correction above.':'Using the per-pitch value × count.'}</li>`; }).join('')}
      ${fl.filter(x=>x.type==='summary').map(x=>`<li><b>Session average disagrees</b> ${esc(MK[x.key].label)}: sheet ${x.sheet}, pitch-weighted ${x.computed}.</li>`).join('')}
      ${fl.filter(x=>x.type==='kept').map(x=>`<li><b>Checked and kept</b> ${lab(x)}: ${x.raw}. ${esc(x.why)}</li>`).join('')}
      ${fl.filter(x=>x.type==='suspect').map(x=>`<li><b>Needs a look</b> ${lab(x)}: ${x.value} (${esc(x.why)}). Not changed.</li>`).join('')}
      ${fl.length===0?'<li>Clean. No issues found.</li>':''}
    </ul></div>`;}).join('')}
  ${(D.held||[]).length?`<div class="panel"><h3>Held off the page</h3><ul class="log">${D.held.map(h=>`<li><b>${esc(h.file)}</b>, ${esc(h.sheet)} (dated ${md(h.sheetDate)} on the sheet): ${h.captured} pitches (${Object.entries(h.mix).map(([k,v])=>k+' '+v).join(', ')}). ${esc(h.why)}</li>`).join('')}</ul></div>`:''}
  <div class="panel"><h3>Reading the numbers</h3><ul class="log">
    <li>Values are averages per pitch type from the capture system. Game averages weight each pitch type by how many were captured.</li>
    <li>Release side, height, and extension are in inches in the capture system's own frame. They line up with each other within this file; they are not the same zero as ball-tracking release numbers.</li>
    <li>Angles keep the sign convention of the export (many read negative by design).</li>
    <li>Checks run on every build: template layout row by row, pitch columns matched by name, repeated rows compared, game totals recomputed, session averages rebuilt, lone sign flips and far-off values flagged, and each sheet matched to a real start by pitch mix.</li>
    ${S.some(away)?`<li>Games at a park other than ${esc(homePark)} are marked. Different camera installs can shift some angles, so compare them with care.</li>`:''}
  </ul></div>`;
}


/* ================= ANALYTICS ================= */
const ATABS = [['season','Season'],['starts','Starts'],['shapes','Shapes'],['results','Results'],['locations','Locations']];
const aStarts = () => AS.filter(x=>st.aOpeners || x.role==='starter');
const aF = () => AS.find(x=>x.date===st.aFocus) || AS[AS.length-1];
const aPitches = src => PORDER.filter(p=>src[p] && src[p].n>0);
const num = (v,d=1) => v==null ? '–' : (+v).toFixed(d);
const pct = v => v==null ? '–' : Math.round(v)+'%';
const sgn = (v,d=1) => v==null ? '–' : (v>0?'+':'')+(+v).toFixed(d);
const mph = v => v==null ? '–' : (+v).toFixed(1);

function aRail(){
  return `<div class="rail" role="group" aria-label="Focus start">${aStarts().map(x=>{
    const l=x.line;
    return `<button class="game" data-a="${x.date}" aria-pressed="${st.aFocus===x.date}">
      ${x.mocap?`<span class="park" style="color:var(--accent)">mocap</span>`:''}
      <b>${longDate(x.date)}</b><span class="opp">${x.home?'vs ':'at '}${esc(x.oppAbbr)}</span>
      <div class="ln">${l.ip} IP, ${l.h} H, ${l.er} ER, ${l.bb} BB, ${l.k} K</div>
      <div class="cap">${l.pc} pitches${RV[x.date]?' · reviewed':''}</div></button>`;}).join('')}</div>
  <div class="ctl" style="margin-top:8px"><label style="font-size:13px;color:var(--muted)"><input type="checkbox" id="openers" ${st.aOpeners?'checked':''}> show opener-length starts before ${md(A.player.window_start)}</label></div>`;
}
function aTabs(){ return `<div class="tabs" role="tablist">${ATABS.map(([k,l])=>`<button role="tab" data-atab="${k}" aria-selected="${st.aTab===k}">${l}</button>`).join('')}</div>`; }

function tile(v,l){ return `<div class="card" style="text-align:left"><div style="font-family:var(--display);font-size:30px;font-weight:700;line-height:1">${v}</div><div class="u" style="margin-top:4px">${l}</div></div>`; }

/* movement chart: season averages (big) + per-start averages (small); focus start ringed */
function moveChart(focus){
  const W=520,H=440,L=46,R=14,T=14,B=44;
  const pts=[]; aStarts().forEach(x=>aPitches(x.pitches).forEach(p=>{ const v=x.pitches[p]; if(v.n>=3) pts.push({x:v.hb,y:v.ivb,p,foc:x.date===focus.date}); }));
  const sea=A.season.pitches;
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.y);
  const lim=Math.ceil(Math.max(22,...xs.map(Math.abs),...ys.map(Math.abs))/5)*5;
  const X=scale(-lim,lim,L,W-R), Y=scale(-lim,lim,H-B,T);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pitch movement">`;
  for(let t=-lim;t<=lim;t+=5){ g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H-B}" stroke="var(--grid)" stroke-width="${t===0?1.5:1}"/><line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="${t===0?1.5:1}"/>`;
    if(t%10===0){ g+=`<text x="${X(t)}" y="${H-B+14}" font-size="10" text-anchor="middle" fill="var(--muted)">${t}</text><text x="${L-6}" y="${Y(t)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${t}</text>`; } }
  g+=`<text x="${(L+W-R)/2}" y="${H-8}" font-size="12" text-anchor="middle" fill="var(--ink-soft)">← arm side    side-to-side movement (in)    glove side →</text>`;
  g+=`<text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" font-size="12" text-anchor="middle" fill="var(--ink-soft)">up-and-down movement (in)</text>`;
  pts.filter(q=>!q.foc).forEach(q=>{ g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="3.2" fill="${pc(q.p)}" opacity=".35"/>`; });
  aPitches(sea).forEach(p=>{ const v=sea[p]; g+=`<circle cx="${X(v.hb)}" cy="${Y(v.ivb)}" r="11" fill="${pc(p)}" opacity=".9"><title>${PT[p]} season: ${num(v.hb)} in side, ${num(v.ivb)} in up</title></circle><text x="${X(v.hb)}" y="${Y(v.ivb)+4}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--bg)">${p}</text>`; });
  pts.filter(q=>q.foc).forEach(q=>{ g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="6" fill="none" stroke="var(--gold)" stroke-width="2"><title>${md(focus.date)} ${PT[q.p]}: ${num(q.x)} side, ${num(q.y)} up</title></circle>`; });
  return g+'</svg>';
}

/* line across starts */
function startLine(getter, opts={}){
  const W=opts.w||300,H=opts.h||130,L=36,R=8,T=12,B=22;
  const xs=aStarts();
  const series=(opts.pitches||['all']).map(p=>({p, vals:xs.map(x=>getter(x,p))}));
  const all=series.flatMap(sr=>sr.vals).filter(v=>v!=null);
  if(!all.length) return '<div class="empty">No data.</div>';
  let [lo,hi]=nice(Math.min(...all),Math.max(...all));
  if (opts.zero){ lo=Math.min(lo,0); }
  const X=i=>L+(xs.length<2?0:(W-L-R)*i/(xs.length-1)), Y=scale(lo,hi,H-B,T);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
  [lo+(hi-lo)*0.1,(lo+hi)/2,hi-(hi-lo)*0.1].forEach(t=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${L-4}" y="${Y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${(+t).toFixed(opts.d??1)}</text>`; });
  if (opts.zero && lo<0 && hi>0) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1.5"/>`;
  xs.forEach((x,i)=>{ if(x.date===st.aFocus) g+=`<rect x="${X(i)-6}" y="${T-6}" width="12" height="${H-B-T+10}" rx="3" fill="var(--gold-soft)"/>`; if(x.mocap) g+=`<circle cx="${X(i)}" cy="${H-B+6}" r="2.2" fill="var(--accent)"/>`; });
  const lab=[0,Math.floor((xs.length-1)/2),xs.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  lab.forEach(i=>{ g+=`<text x="${X(i)}" y="${H-3}" font-size="9" text-anchor="middle" fill="var(--muted)">${md(xs[i].date)}</text>`; });
  series.forEach(sr=>{
    const col=sr.p==='all'?'var(--ink)':pc(sr.p);
    let d='', pen=false;
    sr.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" opacity=".85"/>`;
    sr.vals.forEach((v,i)=>{ if(v==null) return;
      const r=xs[i].date===st.aFocus?3.6:2.4, road=!xs[i].home, t=`<title>${md(xs[i].date)} ${xs[i].home?'vs':'at'} ${xs[i].oppAbbr||''} ${sr.p==='all'?'':PT[sr.p]+' '}${(+v).toFixed(opts.d??1)}</title>`;
      g+= road ? `<circle cx="${X(i)}" cy="${Y(v)}" r="${r}" fill="var(--panel)" stroke="${col}" stroke-width="1.6">${t}</circle>`
               : `<circle cx="${X(i)}" cy="${Y(v)}" r="${r}" fill="${col}">${t}</circle>`; });
  });
  return g+'</svg>';
}
function pitchLegend(list){ return `<div class="legend">${list.map(p=>`<span class="pt" style="--c:${pc(p)}">${p} ${PT[p]}</span>`).join('')}<span class="pt" style="--c:var(--accent)">mocap game</span></div>`; }

function vASeason(){
  const se=A.season, L=se.line, cc=se.cc, sp=se.pitches, ps=aPitches(sp), lg=A.league;
  const rows=ps.map(p=>{ const v=sp[p]; return `<tr><td><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></td>
    <td>${Math.round(100*v.n/se.all.n)}%</td><td>${mph(v.velo)}</td><td>${num(v.ivb)}</td><td>${num(v.hb)}</td><td>${Math.round(v.spin)}</td>
    <td>${num(v.arm)}°</td><td>${num(v.vaa)}°</td><td>${num(v.ext)}</td>
    <td>${pct(v.whiffPct)}</td><td>${pct(v.csw)}</td><td>${pct(v.zonePct)}</td><td>${pct(v.chasePct)}</td>
    <td>${num(v.ev)}</td><td>${sgn(v.runsSaved)}</td></tr>`; }).join('');
  const ctx = ps.filter(p=>lg[p]).map(p=>{ const c=lg[p];
    const dropWord = p==='FF' ? (c.dropVs<0 ? `${num(-c.dropVs)} in more carry (less drop)` : `${num(c.dropVs)} in less carry (more drop)`) : (c.dropVs<0 ? `${num(-c.dropVs)} in less drop` : `${num(c.dropVs)} in more drop`);
    const brkWord = c.brkVs>0 ? `${num(c.brkVs)} in more side-to-side` : `${num(-c.brkVs)} in less side-to-side`;
    const bar=(v,lab)=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><span style="width:92px">${lab}</span><span style="flex:1;height:6px;background:var(--grid);border-radius:3px;position:relative"><span style="position:absolute;left:${Math.max(0,Math.min(100,v))}%;top:-3px;width:3px;height:12px;background:${pc(p)};border-radius:2px"></span></span><span style="width:34px;text-align:right">${v==null?'–':Math.round(v)}</span></div>`;
    return `<div class="card"><div class="t"><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></div>
      <p style="margin:6px 0 8px;font-size:14px;color:var(--ink-soft)">${dropWord} and ${brkWord} than ${PT[p].toLowerCase()}s thrown at his speed and release by other right-handers.</p>
      ${bar(c.dropPct,'drop rank')}${bar(c.brkPct,'side rank')}
      <div class="u" style="margin-top:6px">Rank = where he sits among ${c.pool} right-handers (0 = least, 100 = most, relative to their own expected movement). Full season, ${c.n} pitches.</div></div>`; }).join('');
  const states=['First pitch','Ahead','Even','Behind','Two strikes'];
  const usage=(h)=>states.map(sname=>{ const m=(se.byCount[sname]||{})[h]||{}; const tot=Object.values(m).reduce((a,b)=>a+b,0); if(!tot) return '';
    return `<div style="display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:13px"><span>${sname}</span><span style="display:flex;height:16px;border-radius:3px;overflow:hidden">${PORDER.filter(p=>m[p]).map(p=>`<span title="${PT[p]} ${Math.round(100*m[p]/tot)}%" style="width:${100*m[p]/tot}%;background:${pc(p)}"></span>`).join('')}</span><span class="unit" style="text-align:right">${tot}</span></div>`; }).join('');
  return `<h2>Season as a starter</h2><p class="lede">${esc(A.player.window_note)} Numbers below cover ${se.starts} starts through ${longDate(AS[AS.length-1].date)}.</p>
  <div class="sm" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-bottom:16px">
    ${tile(se.starts,'starts')}${tile(L.ip,'innings')}${tile(num(L.era,2),'ERA')}${tile(num(L.kPct)+'%','strikeout rate')}${tile(num(L.bbPct)+'%','walk rate')}${tile(num(L.whip,2),'WHIP')}${tile(pct(cc.fps),'first-pitch strikes')}${tile(`${cc.twoStrike}/${cc.pas}`,'hitters to two strikes')}
  </div>
  <div class="panel"><h3>The arsenal</h3><div class="tw"><table><thead><tr><th>Pitch</th><th>Usage</th><th>mph</th><th>Up-down<br><span class="unit">in</span></th><th>Side<br><span class="unit">in, − = arm side</span></th><th>Spin<br><span class="unit">rpm</span></th><th>Arm angle</th><th>Approach<br><span class="unit">angle</span></th><th>Extension<br><span class="unit">ft</span></th><th>Miss rate<br><span class="unit">per swing</span></th><th>Called +<br>missed</th><th>In zone</th><th>Chase</th><th>Hit speed<br><span class="unit">mph</span></th><th>Runs saved</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="stamp">Runs saved: positive is good for him. Approach angle is how steeply the pitch is coming down as it crosses the plate.</p></div>
  <div class="grid2">
    <div class="panel"><h3>Movement</h3>${moveChart(aF())}<div class="stamp">Big dots: season. Small dots: each start. Gold rings: ${longDate(aF().date)}.</div></div>
    <div class="panel"><h3>What he throws, by count</h3><p class="stamp" style="margin-top:0">Share of each pitch in each count, split by hitter side.</p>
      <h3 style="font-size:17px;margin-top:10px">vs lefties</h3>${usage('L')}<h3 style="font-size:17px;margin-top:14px">vs righties</h3>${usage('R')}${pitchLegend(ps).replace('<span class="pt" style="--c:var(--accent)">mocap game</span>','')}</div>
  </div>
  <h3>How his shapes compare</h3><div class="sm">${ctx}</div>`;
}

function vAStarts(){
  const xs=aStarts(), f=aF();
  const rows=xs.slice().reverse().map(x=>{ const c=x.cc, v=x.pitches, rv=RV[x.date];
    return `<tr data-row="${x.date}" style="cursor:pointer${x.date===st.aFocus?';background:var(--gold-soft)':''}"><td>${longDate(x.date)} ${x.home?'vs':'at'} ${esc(x.oppAbbr)} ${x.mocap?'<span class="chip" style="background:var(--raise);color:var(--accent)">mocap</span>':''} ${rv?'<span class="chip" style="background:var(--raise);color:var(--gold)">review</span>':''}</td>

      <td>${pct(c.fps)}</td><td>${c.twoStrike}/${c.pas}</td><td>${pct(x.all.whiffPct)}</td><td>${pct(x.all.csw)}</td><td>${mph(v.FF&&v.FF.velo)}</td><td>${mph(v.SI&&v.SI.velo)}</td><td>${num(x.all.ev)}</td><td>${sgn(x.all.runsSaved)}</td></tr>`; }).join('');
  const rv=RV[f.date];
  const ps=aPitches(f.pitches);
  const mix=`<table><thead><tr><th>Pitch</th><th>#</th><th>mph</th><th>top</th><th>Up-down</th><th>Side</th><th>Spin</th><th>Arm angle</th><th>Swings</th><th>Misses</th><th>Called +<br>missed</th><th>In zone</th><th>Balls in play</th><th>Hit speed</th><th>95+</th><th>Runs saved</th></tr></thead><tbody>${
    ps.map(p=>{ const v=f.pitches[p]; return `<tr><td><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></td><td>${v.n}</td><td>${mph(v.velo)}</td><td>${mph(v.veloMax)}</td><td>${num(v.ivb)}</td><td>${num(v.hb)}</td><td>${Math.round(v.spin)}</td><td>${num(v.arm)}°</td><td>${v.swings}</td><td>${v.whiffs}</td><td>${pct(v.csw)}</td><td>${pct(v.zonePct)}</td><td>${v.bip}</td><td>${num(v.ev)}</td><td>${v.hard}</td><td>${sgn(v.runsSaved)}</td></tr>`; }).join('')}</tbody></table>`;
  const review = rv ? `<div class="panel"><h3>Game review</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${Object.entries(rv.grades).map(([k,n])=>`<span class="chip" style="background:var(--raise);color:${k==='CLEAN'?'var(--CH)':k==='FIXABLE'?'var(--gold)':'var(--ink-soft)'};font-size:13px">${n} ${k}</span>`).join('')}</div>
      ${rv.notes.map(n=>`<div class="note"><p>${esc(n)}</p></div>`).join('')}
      <p class="stamp">${esc(RV.legend||'')}</p></div>` : '';
  return `<h2>Start by start</h2><p class="lede">Tap a row or a card above to focus a start. "Mocap" marks starts that also have a biomechanics capture.</p>
  <div class="panel tw"><table><thead><tr><th>Start</th><th></th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>HR</th><th>Pitches</th><th>First-pitch<br>strikes</th><th>To two<br>strikes</th><th>Miss rate</th><th>Called +<br>missed</th><th>4-seam<br>mph</th><th>Sinker<br>mph</th><th>Hit speed</th><th>Runs saved</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2 style="font-size:24px">${longDate(f.date)} ${f.home?'vs':'at'} ${esc(f.opp)} ${f.mocap?`<button class="btn ghost" id="toMocap" style="margin-left:10px;font-size:13px">See the mocap for this start</button>`:''}</h2>
  ${review}<div class="panel tw">${mix}</div>
  <h3>Across starts</h3><div class="sm">
    <div class="card"><div class="t">First-pitch strikes</div><div class="u">%</div>${startLine(x=>x.cc.fps,{d:0})}</div>
    <div class="card"><div class="t">Hitters to two strikes</div><div class="u">% of batters faced</div>${startLine(x=>x.cc.pas?100*x.cc.twoStrike/x.cc.pas:null,{d:0})}</div>
    <div class="card"><div class="t">Miss rate</div><div class="u">misses per swing, %</div>${startLine(x=>x.all.whiffPct,{d:0})}</div>
    <div class="card"><div class="t">Runs saved</div><div class="u">positive = good</div>${startLine(x=>x.all.runsSaved,{zero:true})}</div>
  </div>`;
}

// Home and road tracking installs do not read the same. Measure the gap from his own
// season rather than asserting it, and only say so when it is bigger than the noise.
function roadNote(){
  const xs=aStarts(), rows=[];
  [['FF','ivb','four-seam ride','in',1],['SI','hb','sinker run','in',1],['FF','velo','four-seam velocity','mph',1],['SW','hb','sweeper sweep','in',1]]
    .forEach(([p,k,lab,u,d])=>{
      const h=[],r=[];
      xs.forEach(x=>{ const v=x.pitches[p]; if(v&&v.n>=3&&v[k]!=null)(x.home?h:r).push(v[k]); });
      if(h.length<5||r.length<5) return;
      const mean=a=>a.reduce((s,v)=>s+v,0)/a.length, sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));};
      const t=(mean(h)-mean(r))/Math.sqrt(sd(h)**2/h.length+sd(r)**2/r.length);
      if(Math.abs(t)<2.5) return;                       // not separable from noise
      // these all read as "more is more", so compare size and ignore the sign convention
      rows.push({lab,u,d,h:Math.abs(mean(h)),r:Math.abs(mean(r)),nh:h.length,nr:r.length});
    });
  if(!rows.length) return '';
  return `<div class="caution"><b>Home and road do not read the same</b>
    <p>Each park runs its own tracking install, and his numbers shift with it. Measured across his own ${xs.length} starts, the gap is big enough to see:</p>
    <ul class="roadlist">${rows.map(o=>`<li><b>${o.lab}</b> reads ${Math.abs(o.h-o.r).toFixed(o.d)} ${o.u} ${o.r<o.h?'less':'more'} on the road — ${o.h.toFixed(o.d)} at home over ${o.nh} starts, ${o.r.toFixed(o.d)} away over ${o.nr}.</li>`).join('')}</ul>
    <p>So compare home starts with home starts. A road start sitting under his season line is usually the park, not the pitch.</p></div>`;
}
function vAShapes(){
  const ps=aPitches(A.season.pitches);
  const pick=st.aPitch==='all'?ps:[st.aPitch];
  const m=[['velo','Velocity','mph',1],['ivb','Up-and-down movement','in',1],['hb','Side-to-side movement','in (− = arm side)',1],['spin','Spin','rpm',0],['arm','Arm angle','°',1],['ext','Extension','ft',1],['relZ','Release height','ft',2],['vaa','Approach angle','°',1]];
  const f=aF();
  return `<h2>Shapes</h2><p class="lede">How each pitch has moved start to start. Gold band is ${longDate(f.date)}; blue ticks mark starts with a mocap capture, so shape changes can be read next to the body. Open dots are road starts — see the note below before reading a dip.</p>
  ${roadNote()}
  <div class="ctl"><select id="apitch" aria-label="Pitch"><option value="all">All pitches</option>${ps.map(p=>`<option value="${p}"${st.aPitch===p?' selected':''}>${PT[p]}</option>`).join('')}</select></div>
  ${pitchLegend(pick)}
  <div class="sm">${m.map(([k,l,u,d])=>`<div class="card"><div class="t">${l}</div><div class="u">${u}</div>${startLine((x,p)=>x.pitches[p]&&x.pitches[p].n>=3?x.pitches[p][k]:null,{pitches:pick,d,h:150})}</div>`).join('')}</div>
  <div class="grid2" style="margin-top:16px"><div class="panel"><h3>Movement</h3>${moveChart(f)}<div class="stamp">Big dots: season. Small dots: each start. Gold rings: ${longDate(f.date)}.</div></div>
  <div class="panel"><h3>${longDate(f.date)} vs his season</h3><div class="tw"><table><thead><tr><th>Pitch</th><th>mph</th><th>Up-down</th><th>Side</th><th>Spin</th><th>Arm angle</th></tr></thead><tbody>${
    aPitches(f.pitches).filter(p=>A.season.pitches[p]).map(p=>{ const v=f.pitches[p], s0=A.season.pitches[p];
      const cell=(a,b,d)=>a==null?'–':`${num(a,d)} <span class="unit">${sgn(a-b,d)}</span>`;
      return `<tr><td><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></td><td>${cell(v.velo,s0.velo,1)}</td><td>${cell(v.ivb,s0.ivb,1)}</td><td>${cell(v.hb,s0.hb,1)}</td><td>${cell(v.spin,s0.spin,0)}</td><td>${cell(v.arm,s0.arm,1)}</td></tr>`; }).join('')}</tbody></table></div>
  <p class="stamp">Small number = difference from his season average.</p></div></div>`;
}

function vAResults(){
  const xs=aStarts(), ps=aPitches(A.season.pitches);
  const metric=st.aMetric;
  const defs={whiffPct:['Miss rate (per swing)',v=>v.whiffPct,'%'],csw:['Called + missed strikes',v=>v.csw,'%'],zonePct:['In the zone',v=>v.zonePct,'%'],chasePct:['Chase rate',v=>v.chasePct,'%'],ev:['Average hit speed',v=>v.ev,'mph'],runsSaved:['Runs saved',v=>v.runsSaved,''],usage:['Usage',v=>v.n,'pitches']};
  const [lab,get,unit]=defs[metric]||defs.whiffPct;
  const vals=xs.flatMap(x=>ps.map(p=>x.pitches[p]&&x.pitches[p].n>=3?get(x.pitches[p]):null)).filter(v=>v!=null);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const good = metric==='ev' ? -1 : 1;
  const shade=v=>{ if(v==null) return ''; const t=(v-lo)/((hi-lo)||1); const g=good>0?t:1-t; return `background:rgba(201,171,82,${(0.05+0.4*g).toFixed(2)})`; };
  const grid=`<table><thead><tr><th>Start</th>${ps.map(p=>`<th><span class="pt" style="--c:${pc(p)}">${p}</span></th>`).join('')}</tr></thead><tbody>${
    xs.slice().reverse().map(x=>`<tr${x.date===st.aFocus?' style="outline:1px solid var(--gold-line)"':''}><td>${longDate(x.date)} ${x.home?'vs':'at'} ${esc(x.oppAbbr)}</td>${ps.map(p=>{ const v=x.pitches[p]; const val=v&&v.n>=3?get(v):null; return `<td style="${metric==='usage'?'':shade(val)}">${val==null?'<span class="unit">–</span>':(metric==='runsSaved'?sgn(val):Math.round(val))}${v&&metric!=='usage'?`<span class="unit"> ${v.n}</span>`:''}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  const sp=A.season.pitches;
  const res=`<table><thead><tr><th>Pitch</th><th>Pitches</th><th>Swings</th><th>Misses</th><th>Miss rate</th><th>Balls in play</th><th>Avg hit speed</th><th>Hardest</th><th>95+ mph</th><th>Damage on contact</th><th>Runs saved</th></tr></thead><tbody>${
    ps.map(p=>{ const v=sp[p]; return `<tr><td><span class="pt" style="--c:${pc(p)}">${PT[p]}</span></td><td>${v.n}</td><td>${v.swings}</td><td>${v.whiffs}</td><td>${pct(v.whiffPct)}</td><td>${v.bip}</td><td>${num(v.ev)}</td><td>${num(v.evMax)}</td><td>${v.hard}</td><td>${v.xwoba==null?'–':v.xwoba.toFixed(3).replace(/^0/,'')}</td><td>${sgn(v.runsSaved)}</td></tr>`; }).join('')}</tbody></table>`;
  return `<h2>Results by pitch</h2><p class="lede">What each pitch did, start by start. Small grey number = pitches thrown; starts with fewer than 3 of a pitch are left blank.</p>
  <div class="ctl"><span class="seg">${Object.entries(defs).map(([k,d])=>`<button data-am="${k}" aria-pressed="${metric===k}">${d[0].replace(' (per swing)','')}</button>`).join('')}</span></div>
  <div class="panel tw"><h3>${lab}${unit&&metric!=='usage'?` <span class="unit">${unit}</span>`:''}</h3>${grid}</div>
  <div class="panel tw"><h3>Season totals as a starter</h3>${res}<p class="stamp">Damage on contact: expected value of the contact allowed, from hit speed and angle (lower is better; league average is around .370).</p></div>`;
}

function zonePlot(x, filt){
  const W=320,H=380, cx=W/2, sc=62, top=40;
  const X=v=>cx+v*sc, Y=v=>top+(4.4-v)*sc;
  const dots=x.dots.filter(d=>filt==='all'||d[0]===filt);
  const szT=x.dots.reduce((a,d)=>a+(d[3]||0),0)/x.dots.length, szB=x.dots.reduce((a,d)=>a+(d[4]||0),0)/x.dots.length;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pitch locations, catcher's view">`;
  g+=`<rect x="${X(-0.83)}" y="${Y(szT)}" width="${1.66*sc}" height="${(szT-szB)*sc}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  for(let i=1;i<3;i++){ g+=`<line x1="${X(-0.83+1.66*i/3)}" x2="${X(-0.83+1.66*i/3)}" y1="${Y(szT)}" y2="${Y(szB)}" stroke="var(--grid)"/><line x1="${X(-0.83)}" x2="${X(0.83)}" y1="${Y(szT-(szT-szB)*i/3)}" y2="${Y(szT-(szT-szB)*i/3)}" stroke="var(--grid)"/>`; }
  g+=`<line x1="10" x2="${W-10}" y1="${Y(A.thresholds.low)}" y2="${Y(A.thresholds.low)}" stroke="var(--gold)" stroke-dasharray="4 4" opacity=".6"/><text x="${W-10}" y="${Y(A.thresholds.low)-4}" font-size="10" text-anchor="end" fill="var(--gold)">${A.thresholds.low} ft</text>`;
  g+=`<path d="M${X(-0.71)} ${Y(0)} L${X(0.71)} ${Y(0)} L${X(0.71)} ${Y(0)+8} L${X(0)} ${Y(0)+16} L${X(-0.71)} ${Y(0)+8} Z" fill="none" stroke="var(--line)"/>`;
  const mark={W:'miss',C:'called strike',B:'in play',F:'foul',O:'ball'};
  dots.forEach(d=>{ if(d[1]==null) return; const col=pc(d[0]);
    const r=d[5]==='B'&&d[6]>=95?7:5;
    const common=`<title>${PT[d[0]]} ${d[10]} mph, ${d[8]}-${d[9]} to a ${d[7]==='L'?'lefty':'righty'}: ${mark[d[5]]}${d[6]!=null?', '+d[6]+' mph off the bat':''}</title>`;
    if(d[5]==='W') g+=`<circle cx="${X(d[1])}" cy="${Y(d[2])}" r="${r}" fill="${col}" stroke="var(--ink)" stroke-width="1.5">${common}</circle>`;
    else if(d[5]==='B') g+=`<rect x="${X(d[1])-r}" y="${Y(d[2])-r}" width="${2*r}" height="${2*r}" fill="none" stroke="${col}" stroke-width="2">${common}</rect>`;
    else g+=`<circle cx="${X(d[1])}" cy="${Y(d[2])}" r="${r}" fill="${col}" opacity="${d[5]==='O'?0.35:0.8}">${common}</circle>`;
  });
  return g+`<text x="${cx}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">catcher's view</text></svg>`;
}
function vALocations(){
  const f=aF(), xs=aStarts(), ps=aPitches(f.pitches), filt=(st.aPitch==='all'||f.pitches[st.aPitch])?st.aPitch:'all';
  const heights = p => `<div class="card"><div class="t"><span class="pt" style="--c:${pc(p)}">${PT[p]}</span> height by start</div>
    <div class="u">buried under ${A.thresholds.low} ft · ${A.thresholds.low}–${A.thresholds.high} ft · over ${A.thresholds.high} ft</div>
    ${xs.map(x=>{ const v=x.pitches[p]; if(!v||v.n<3) return ''; const t=v.low+v.mid+v.high;
      return `<div style="display:grid;grid-template-columns:48px 1fr 104px;gap:8px;align-items:center;margin:3px 0;font-size:12px"><span${x.date===st.aFocus?' style="color:var(--gold)"':''}>${md(x.date)}</span><span style="display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--grid)"><span style="width:${100*v.low/t}%;background:${pc(p)}"></span><span style="width:${100*v.mid/t}%;background:${pc(p)};opacity:.45"></span><span style="width:${100*v.high/t}%;background:var(--line)"></span></span><span class="unit">${v.low} of ${t} buried</span></div>`; }).join('')}</div>`;
  return `<h2>Locations</h2><p class="lede">${longDate(f.date)} from the catcher's view. Filled dot with an outline = swing and miss. Square = ball in play (bigger square = hit 95 mph or harder). Faint dot = ball. The dashed line marks ${A.thresholds.low} ft, our line for "buried."</p>
  <div class="ctl"><select id="apitch" aria-label="Pitch"><option value="all">All pitches</option>${ps.map(p=>`<option value="${p}"${filt===p?' selected':''}>${PT[p]}</option>`).join('')}</select></div>
  <div class="grid2"><div class="panel">${zonePlot(f,filt)}${pitchLegend(filt==='all'?ps:[filt]).replace('<span class="pt" style="--c:var(--accent)">mocap game</span>','')}</div>
  <div>${heights(filt!=='all'?filt:(f.pitches.CH?'CH':ps[0]))}</div></div>
  <h3>Height by start, every pitch</h3><div class="sm">${aPitches(A.season.pitches).filter(p=>p!==(filt!=='all'?filt:(f.pitches.CH?'CH':ps[0]))).map(heights).join('')}</div>`;
}

function vAnalytics(){
  if(!A) return `<div class="pend"><h2>Analytics report</h2><p class="lede" style="margin:0 auto">No analytics file found for this player yet. Run tools/build_analytics.py.</p></div>`;
  const V={season:vASeason,starts:vAStarts,shapes:vAShapes,results:vAResults,locations:vALocations}[st.aTab];
  return aRail()+aTabs()+`<section role="tabpanel">${V()}</section>`;
}
function bindAnalytics(app){
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{st.aFocus=b.dataset.a;render();});
  app.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{st.aFocus=b.dataset.row;render();});
  app.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{st.aTab=b.dataset.atab;render();});
  app.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{st.aMetric=b.dataset.am;render();});
  const o=app.querySelector('#openers'); if(o) o.onchange=()=>{st.aOpeners=o.checked; if(!st.aOpeners && aF().role!=='starter') st.aFocus=AS[AS.length-1].date; render();};
  const ap=app.querySelector('#apitch'); if(ap) ap.onchange=()=>{st.aPitch=ap.value;render();};
  const tm=app.querySelector('#toMocap'); if(tm) tm.onclick=()=>{st.report='bio';st.focus=st.aFocus;st.tab='summary';render();window.scrollTo(0,0);};
}

/* ---------- exports ---------- */
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function csv(){
  const rows=[['player','date','opponent','venue','pitch_type','pitches','group','metric_key','metric','unit','value','corrected_from']];
  S.forEach(s=>{
    pitchesOf(s).forEach(p=>M.forEach(m=>{ const v=s.pitches[p].v[m.key]; const fx=fixedCell(s,m.key,p);
      rows.push([P.name,s.date,s.oppAbbr||'',s.venue||'',p,s.pitches[p].n,m.group,m.key,m.label,m.unit,v??'',fx?fx.raw:'']); }));
    M.forEach(m=>rows.push([P.name,s.date,s.oppAbbr||'',s.venue||'','GAME',s.captured,m.group,m.key,m.label,m.unit,s.all[m.key]??'','']));
  });
  download(P.name.toLowerCase().replace(/\s+/g,'-')+'-biomech.csv', rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n'),'text/csv');
}

/* ---------- render ---------- */
function render(){
  document.getElementById('facts').innerHTML = st.report==='ana' ? factsAna : factsBio;
  document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.report===st.report));
  const app=document.getElementById('app');
  const railFocus = () => { const b=app.querySelector('.rail [aria-pressed=true]'); if(b){ const r=b.parentElement; r.scrollLeft = b.offsetLeft - r.offsetLeft - 8; } };
  if (st.report==='ana'){ app.innerHTML=vAnalytics(); bindAnalytics(app); railFocus(); return; }
  const V={summary:vSummary,sequence:vSequence,pitches:vPitches,shape:vShape,load:vLoad,body:vBody,data:vData,log:vLog}[st.tab];
  app.innerHTML = vRail()+vTabs()+`<section role="tabpanel">${V()}</section>`;
  app.querySelectorAll('.game').forEach(b=>b.onclick=()=>{st.focus=b.dataset.g;render();});
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.dataMode=b.dataset.mode;render();});
  const g=app.querySelector('#grp'); if(g) g.onchange=()=>{st.dataGroup=g.value;render();};
  const ls=app.querySelector('#linkSel'); if(ls) ls.onchange=()=>{const l=LINKS[+ls.value]; st.linkM=l.m; st.linkT=l.t; render();};
  const q=app.querySelector('#q'); if(q) q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos);};
  railFocus();
  const c=app.querySelector('#csv'); if(c) c.onclick=csv;
  const j=app.querySelector('#json'); if(j) j.onclick=()=>download(P.name.toLowerCase().replace(/\s+/g,'-')+'-biomech.json',JSON.stringify(D,null,1),'application/json');
}
render();
}
